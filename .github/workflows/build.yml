name: Build, test, and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x86_64
            artifact: linux-x86_64
          - os: macos-latest
            label: macOS Universal
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev libudev-dev
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCARLET_BUNDLE_SDL=ON
      - name: Configure macOS Universal
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCARLET_BUNDLE_SDL=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Verify both Mac architectures
        if: runner.os == 'macOS'
        run: lipo -verify_arch arm64 x86_64 build/scarlet-mesa
      - name: Simulation and application tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Create native package
        run: bash scripts/package.sh build dist
      - name: Test extracted package
        shell: bash
        run: |
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            game="$(find "$PWD/extracted" -path '*/Contents/MacOS/scarlet-mesa' -type f)"
          else
            game="$(find "$PWD/extracted" -name scarlet-mesa -type f)"
          fi
          cd "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$game" --smoke-test "$GITHUB_WORKSPACE/package-smoke"
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-mesa-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.artifact }}
          path: |
            build/smoke-artifacts
            package-smoke
          if-no-files-found: ignore
          retention-days: 14

  macos-intel-smoke:
    name: macOS Intel package smoke
    needs: native
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scarlet-mesa-macos-universal
          path: native-download
      - name: Run Universal package on Intel
        shell: bash
        run: |
          mkdir extracted
          tar -xzf native-download/*.tar.gz -C extracted
          game="$(find "$PWD/extracted" -path '*/Contents/MacOS/scarlet-mesa' -type f)"
          lipo -verify_arch arm64 x86_64 "$game"
          cd "$RUNNER_TEMP"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$game" --smoke-test "$GITHUB_WORKSPACE/intel-smoke"
      - name: Upload Intel smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos-intel
          path: intel-smoke
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, macos-intel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: scarlet-mesa-*
          path: release-assets
          merge-multiple: true
      - name: Publish free downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Scarlet Mesa $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
